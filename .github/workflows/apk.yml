name: APK

on:
  push:
    branches-ignore:
      - ci-logs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Derle
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      - name: Hata kaydini ci-logs dalina yaz
        if: failure()
        run: |
          grep -nE -A4 "error:|What went wrong" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null
          git add -f build.log
          git commit -m "Derleme kaydi ${GITHUB_SHA}" >/dev/null
          git push -f origin ci-logs

      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk artci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: artci
          path: artci.apk

      - name: Son surum olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Artci" --notes "Otomatik derleme" --target "$GITHUB_SHA"
          gh release upload latest artci.apk --clobber
          gh release delete-asset latest dominar-panel.apk -y >/dev/null 2>&1 || true
          gh release edit latest --title "Artci"
          gh release edit latest --notes "Surum 0.1.${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7})"
